name: docs

on:
  push:
    branches: [ main, feature/** ]
    paths:
      - 'docs/**'
      - 'CMakeLists.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'CMakeLists.txt'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.4.0"

      - name: Configure
        run: cmake --preset dev-gcc -B build/docs -DBUILD_DOCS=ON

      - name: Build docs
        run: cmake --build build/docs --target docs

      - name: Upload docs
        uses: actions/upload-artifact@v6
        with:
          name: docs
          path: build/docs/docs/html/
          if-no-files-found: error
          retention-days: 7
