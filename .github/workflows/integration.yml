# Builds test/integration against an installed Release package under every
# combination of flags that can affect a stacktrace, and uploads the traces.
# See test/integration/run_matrix.py.

name: integration

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Regex over combination names (e.g. "^O3-g-"); empty runs all
        required: false
        default: ""
  # TODO: temporary, remove before merging to main.
  push:
    branches: [ feature/integration ]
    # Keep in sync with AFFECTS_ALL in test/integration/select_jobs.py.
    paths:
      - include/**
      - src/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - test/integration/**
      - .github/workflows/integration.yml

jobs:
  # Selects the toolchains, and the backends within each, affected by a push.
  # See test/integration/select_jobs.py.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select toolchains and backends
        id: select
        # Only pushes have a base; everything else runs everything.
        run: >-
          python3 test/integration/select_jobs.py
          --base "${{ github.event_name == 'push' && github.event.before || '' }}"
          --head "${{ github.sha }}"

  matrix:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.4.0"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -property installationPath
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Add ubuntu-toolchain-r PPA
        if: matrix.ppa == 'ubuntu-toolchain-r'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update

      - name: Add LLVM APT source
        if: runner.os == 'Linux' && matrix.llvm_ver != ''
        run: |
          CODENAME=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${{ matrix.llvm_ver }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update

      - name: Install Linux tools and compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.packages }}

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja

      # Consumers are built with the same --gcc-install-dir as the library.
      - name: Set clang GCC toolchain
        if: matrix.gcc_toolchain != ''
        run: echo "CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/${{ matrix.gcc_toolchain }}" >> "$GITHUB_ENV"

      - name: Build and install library (Release)
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.cc }}" ]; then
            compiler_args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          if [ -n "${{ matrix.gcc_toolchain }}" ]; then
            compiler_args+=(-DCMAKE_CXX_FLAGS_INIT="$CXXFLAGS")
          fi
          cmake --preset ${{ matrix.preset }} -B build/library \
            "${compiler_args[@]}" -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/library --config Release
          cmake --install build/library --config Release \
            --prefix "${{ runner.temp }}/eggs-stacktrace-install"

      - name: Run integration matrix
        shell: bash
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} test/integration/run_matrix.py \
            --toolchain ${{ matrix.toolchain }} \
            --cxx ${{ matrix.cxx }} \
            --prefix "${{ runner.temp }}/eggs-stacktrace-install" \
            --out "${{ runner.temp }}/integration" \
            --filter "${{ inputs.filter }}" \
            --backends "${{ matrix.run_backends }}"

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-traces-${{ matrix.compiler }}
          path: |
            ${{ runner.temp }}/integration/traces
            ${{ runner.temp }}/integration/summary.csv
            ${{ runner.temp }}/integration/summary.md
          if-no-files-found: ignore
          retention-days: 30
